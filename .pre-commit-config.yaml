# Local hooks run the mise-pinned binaries; run via `mise run lint` (or with mise activated).
exclude: ^(app/src-tauri/(gen|icons)/|firmware/(build/|managed_components/|sdkconfig(\.old)?$)|site/book/)

repos:
  - repo: builtin
    hooks:
      # The vendored font files and their license texts stay byte-identical to upstream.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^fonts/[^/]+/
      - id: end-of-file-fixer
        exclude: ^fonts/[^/]+/

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks git --staged --redact --no-banner
        pass_filenames: false
        always_run: true

      - id: typos
        name: typos
        language: system
        entry: typos
        exclude: ^(app/pnpm-lock\.yaml|fonts/pnpm-lock\.yaml|fonts/[^/]+/)

      - id: biome
        name: biome check
        language: system
        entry: sh -c 'cd app && biome check .'
        files: ^app/.*\.(ts|tsx|js|jsx|json|css|html)$
        pass_filenames: false

      - id: biome-fonts
        name: biome check fonts generator
        language: system
        entry: biome check --config-path=app fonts/generate.mjs
        files: ^fonts/generate\.mjs$
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
        files: ^app/src-tauri/.*\.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --manifest-path app/src-tauri/Cargo.toml -- -D warnings
        files: ^app/src-tauri/.*\.rs$
        pass_filenames: false

      - id: clang-format
        name: clang-format
        language: system
        entry: clang-format --dry-run -Werror
        files: ^firmware/.*\.(c|h)$
        exclude: ^firmware/main/(fonts/|logo_img\.[ch]$)

      # The TF card holds user data in a GPT partition esp_tinyusb and FatFs would see as unformatted, so the
      # firmware never formats it, never lets esp_tinyusb mount it to the app, and never takes it back from USB at
      # run time (plans/settings-sleep-feed/01-groundwork.md, G2). The host tests format their RAM disk, so only
      # firmware/main is checked.
      - id: no-card-format
        name: no card format or esp_tinyusb app mount
        language: pygrep
        # A banned call, a banned name anywhere (the app mount point, the format-on-fail flag), or clearing a guard.
        # yamllint disable-line rule:line-length
        entry: '\b(tinyusb_msc_set_storage_mount_point|tinyusb_msc_format_storage|tinyusb_msc_delete_storage|tinyusb_msc_storage_mount|tinyusb_msc_storage_init_sdmmc|tinyusb_msc_new_storage_sdmmc|tinyusb_msc_new_storage_spiflash|f_mkfs|f_fdisk|esp_vfs_fat_sdcard_format|esp_vfs_fat_sdcard_format_cfg|esp_vfs_fat_sdmmc_mount|esp_vfs_fat_sdspi_mount)\s*\(|\b(TINYUSB_MSC_STORAGE_MOUNT_APP|format_if_mount_failed)\b|\b(auto_mount_off|do_not_format)\s*=\s*(0|false)\b'
        files: ^firmware/main/.*\.(c|h)$

      - id: fonts-generated
        name: fonts generated
        language: system
        entry: mise run fonts:check
        # yamllint disable-line rule:line-length
        files: ^(fonts/|firmware/main/fonts/|firmware/main/font_list\.h$|app/src/fonts\.gen\.ts$|app/src-tauri/src/daemon/fonts_gen\.rs$)
        pass_filenames: false

      - id: rumdl
        name: rumdl
        language: system
        entry: rumdl check
        files: \.md$

      - id: taplo
        name: taplo
        language: system
        entry: taplo fmt --check
        files: \.toml$

      - id: yamllint
        name: yamllint
        language: system
        entry: yamllint --strict
        files: \.ya?ml$

      - id: actionlint
        name: actionlint
        language: system
        entry: actionlint -config-file .forgejo/actionlint.yaml
        files: ^\.forgejo/workflows/.*\.ya?ml$

      - id: zizmor
        name: zizmor
        language: system
        # Online audits can't resolve the full-URL `uses:` form; pinning is still checked.
        entry: zizmor --no-online-audits
        files: ^\.forgejo/(workflows|actions)/.*\.ya?ml$

      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        files: \.sh$
