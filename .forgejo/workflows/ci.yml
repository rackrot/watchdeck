name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A zero-permission GitHub token (server-wide Forgejo variable) so mise gets
# authenticated GitHub API rate limits.
env:
  MISE_GITHUB_TOKEN: ${{ vars.MISE_GITHUB_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: https://github.com/jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          github_token: ${{ vars.MISE_GITHUB_TOKEN }}
      # clippy needs the Tauri system libs and runs in the app job; the gitleaks hook
      # only scans staged changes, so CI scans full history instead.
      - run: mise run lint
        env:
          SKIP: cargo-clippy,gitleaks
      - run: gitleaks git --redact --no-banner

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      # The IDF image has git but no node, and forgejo-runner doesn't inject one,
      # so JavaScript actions like checkout can't run here. Fetch the ref by hand.
      - name: Check out
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git config --global --add safe.directory "$PWD"
          # Prefer the exact commit; fall back to the ref if the server refuses a SHA fetch.
          git fetch -q --depth 1 "$REPO_URL" "$SHA" || git fetch -q --depth 1 "$REPO_URL" "$REF"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'
      # Container jobs bypass the image entrypoint, so export the IDF env by hand.
      - name: Build firmware
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32p4
          idf.py build

      # Host unit tests of proto.c, built for the linux target. Fails the job on any failed case.
      - name: Run host parser tests
        shell: bash
        working-directory: firmware/test/host_proto
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --preview set-target linux build
          timeout 60 build/host_proto.elf

      # The card store (cardfs.c) on IDF's FatFs over a RAM disk, with the power cut at every sector write.
      - name: Run FatFs power-cut test
        shell: bash
        working-directory: firmware/test/host_fatfs
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --preview set-target linux build
          timeout 900 build/host_fatfs.elf

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          # Runner images may run as root without sudo.
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: https://github.com/jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: rust node pnpm
          github_token: ${{ vars.MISE_GITHUB_TOKEN }}
      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri -> target
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm test
        working-directory: app
      - run: cargo clippy --locked -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test --locked
        working-directory: app/src-tauri
      - run: pnpm tauri build --debug --no-bundle
        working-directory: app

  site:
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: https://github.com/jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: mdbook
          github_token: ${{ vars.MISE_GITHUB_TOKEN }}
      - run: mise run site:build
