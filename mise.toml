[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy" }
node = "24"
pnpm = "12.6.0"
python = "3.12"
mdbook = "0.5.4"
biome = "2.5.15"
taplo = "0.10.0"
typos = "1.51.1"
rumdl = "0.2.78"
clang-format = "23.1.3"
actionlint = "1.7.12"
zizmor = "1.30.1"
shellcheck = "0.11.0"
yamllint = "1.38.0"
gitleaks = "8.30.1"
prek = "0.5.5"
# The `sentry` npm package, getsentry's new CLI (not the older sentry-cli). fw:symbols uses it. It
# comes from npm because its GitHub binaries stop at 0.45.0.
"npm:sentry" = "0.47.0"

[env]
ESP_IDF_VERSION = "v6.1"
IDF_TOOLS_PATH = "{{env.HOME}}/.espressif"
IDF_PATH = "{{env.HOME}}/.espressif/esp-idf-{{env.ESP_IDF_VERSION}}"

[tasks."idf:install"]
description = "Clone ESP-IDF (if missing) and install its toolchain for esp32p4"
run = '''
[ -d "$IDF_PATH" ] || git clone --depth 1 -b "$ESP_IDF_VERSION" --recursive --shallow-submodules https://github.com/espressif/esp-idf "$IDF_PATH"
"$IDF_PATH/install.sh" esp32p4
'''

# Extra args after `--` are appended to the command (e.g. `mise run fw:flash -- -p /dev/ttyACM0`).
[tasks."fw:build"]
description = "Build the firmware"
dir = "firmware"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py build'

# Uploads only the debug-only copy, never watchdeck.elf, which holds the Wi-Fi password. Sentry
# doesn't re-symbolicate past events, so run it before the crash. Set the target in the environment
# or in the gitignored mise.local.toml, never here:
#   [env]
#   SENTRY_ORG = "..."
#   SENTRY_PROJECT = "..."
# and log in once with `mise exec -- sentry auth login`.
[tasks."fw:symbols"]
description = "Upload firmware/build/watchdeck.debug.elf to Sentry (needs SENTRY_ORG, SENTRY_PROJECT)"
dir = "{{config_root}}"
run = '''
debug=firmware/build/watchdeck.debug.elf
[ -f "$debug" ] || { echo "fw:symbols: $debug is missing. Run mise run fw:build first." >&2; exit 1; }
[ -n "${SENTRY_ORG:-}" ] && [ -n "${SENTRY_PROJECT:-}" ] || { echo "fw:symbols: set SENTRY_ORG and SENTRY_PROJECT in the environment or mise.local.toml." >&2; exit 1; }
[ firmware/build/watchdeck.elf -nt "$debug" ] && { echo "fw:symbols: $debug is older than watchdeck.elf. Run mise run fw:build first." >&2; exit 1; }
# stdin is /dev/null so a missing login fails instead of prompting
sentry debug-files upload "$debug" </dev/null
'''

# Builds, then with SENTRY_ORG set uploads the symbols, then flashes. A failed upload warns and the
# flash still runs. Port args after `--` land on the last line, which is the flash.
[tasks."fw:flash"]
description = "Build and flash the firmware (uploads symbols between the two when SENTRY_ORG is set)"
dir = "firmware"
run = '''
. "$IDF_PATH/export.sh" >/dev/null || exit 1
idf.py build || exit 1
if [ -n "${SENTRY_ORG:-}" ]; then
  mise run fw:symbols || echo "fw:flash: symbol upload failed, flashing anyway." >&2
fi
idf.py flash
'''

[tasks."fw:monitor"]
description = "Open the serial monitor"
dir = "firmware"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py monitor'

[tasks."fw:menuconfig"]
description = "Open firmware menuconfig"
dir = "firmware"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py menuconfig'

[tasks."fw:test"]
description = "Run the host unit tests for the device message parsers"
dir = "firmware/test/host_proto"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py --preview set-target linux build && timeout 60 build/host_proto.elf'

[tasks."app:dev"]
description = "Run the desktop app in dev mode"
dir = "app"
run = "pnpm tauri dev"

[tasks."app:build"]
description = "Build the desktop app"
dir = "app"
run = "pnpm tauri build"

# Flags after `--` go to the harness: `mise run app:fault -- --device wd-xxxxxxxxxxxx`. The tray app
# must be quit first. See plans/hw-gaps.md.
[tasks."app:fault"]
description = "Run the fault-injection harness against the paired board"
dir = "{{config_root}}"
run = "cargo run --manifest-path app/src-tauri/Cargo.toml --example fault_daemon --"

# Both fault tasks run from the repo root, so a log path means the same to each.
[tasks."app:fault-capture"]
description = "Capture the board's serial log for app:fault (output file after --)"
dir = "{{config_root}}"
run = '"$HOME/.espressif/python_env/idf6.1_py3.12_env/bin/python" app/src-tauri/examples/fault_capture.py'

[tasks."site:build"]
description = "Build the docs site"
run = "mdbook build site"

[tasks."site:serve"]
description = "Serve the docs site locally"
run = "mdbook serve site --open"

[tasks.lint]
description = "Run all pre-commit hooks on every file"
run = "prek run --all-files"

[tasks.fmt]
description = "Format all sources"
run = [
  "cargo fmt --manifest-path app/src-tauri/Cargo.toml",
  "biome format --write app",
  "taplo fmt",
  "rumdl fmt .",
  "git ls-files -z 'firmware/*.c' 'firmware/*.h' | xargs -0 -r clang-format -i",
]
