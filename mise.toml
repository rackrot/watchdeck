[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy" }
node = "24"
pnpm = "12.6.0"
python = "3.12"
mdbook = "0.5.4"
biome = "2.5.15"
taplo = "0.10.0"
typos = "1.51.1"
rumdl = "0.2.78"
clang-format = "23.1.3"
actionlint = "1.7.12"
zizmor = "1.30.1"
shellcheck = "0.11.0"
yamllint = "1.38.0"
gitleaks = "8.30.1"
prek = "0.5.5"

[env]
ESP_IDF_VERSION = "v6.1"
IDF_TOOLS_PATH = "{{env.HOME}}/.espressif"
IDF_PATH = "{{env.HOME}}/.espressif/esp-idf-{{env.ESP_IDF_VERSION}}"

[tasks."idf:install"]
description = "Clone ESP-IDF (if missing) and install its toolchain for esp32p4"
run = '''
[ -d "$IDF_PATH" ] || git clone --depth 1 -b "$ESP_IDF_VERSION" --recursive --shallow-submodules https://github.com/espressif/esp-idf "$IDF_PATH"
"$IDF_PATH/install.sh" esp32p4
'''

# Extra args after `--` are appended to the command (e.g. `mise run fw:flash -- -p /dev/ttyACM0`).
[tasks."fw:build"]
description = "Build the firmware"
dir = "firmware"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py build'

[tasks."fw:flash"]
description = "Flash the firmware"
dir = "firmware"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py flash'

[tasks."fw:monitor"]
description = "Open the serial monitor"
dir = "firmware"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py monitor'

[tasks."fw:menuconfig"]
description = "Open firmware menuconfig"
dir = "firmware"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py menuconfig'

[tasks."fw:test"]
description = "Run the firmware host tests: the unit tests, then the FatFs power-cut test"
run = [{ task = "fw:test:unit" }, { task = "fw:test:fatfs" }]

[tasks."fw:test:unit"]
description = "Run the host unit tests for the device message parsers and modules"
dir = "firmware/test/host_proto"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py --preview set-target linux build && timeout 60 build/host_proto.elf'

# Cuts the power at every sector write of each card operation; see firmware/test/host_fatfs/main/test_cuts.c.
[tasks."fw:test:fatfs"]
description = "Run the FatFs power-cut test of the card store on a RAM disk"
dir = "firmware/test/host_fatfs"
run = '. "$IDF_PATH/export.sh" >/dev/null && idf.py --preview set-target linux build && timeout 900 build/host_fatfs.elf'

[tasks."app:dev"]
description = "Run the desktop app in dev mode"
dir = "app"
run = "pnpm tauri dev"

[tasks."app:build"]
description = "Build the desktop app"
dir = "app"
run = "pnpm tauri build"

# Flags after `--` go to the harness: `mise run app:fault -- --device wd-xxxxxxxxxxxx`. The tray app
# must be quit first. See plans/hw-gaps.md.
[tasks."app:fault"]
description = "Run the fault-injection harness against the paired board"
dir = "{{config_root}}"
run = "cargo run --manifest-path app/src-tauri/Cargo.toml --example fault_daemon --"

# Both fault tasks run from the repo root, so a log path means the same to each.
[tasks."app:fault-capture"]
description = "Capture the board's serial log for app:fault (output file after --)"
dir = "{{config_root}}"
run = '"$HOME/.espressif/python_env/idf6.1_py3.12_env/bin/python" app/src-tauri/examples/fault_capture.py'

[tasks."site:build"]
description = "Build the docs site"
run = "mdbook build site"

[tasks."site:serve"]
description = "Serve the docs site locally"
run = "mdbook serve site --open"

# The converter is lv_font_conv from fonts/pnpm-lock.yaml, not a global install, so its output only
# depends on committed inputs. See plans/fonts.md.
[tasks."fonts:gen"]
description = "Regenerate the font outputs (firmware C, font_list.h, fonts.gen.ts, fonts_gen.rs)"
dir = "{{config_root}}"
run = [
  "pnpm --dir fonts install --frozen-lockfile --ignore-scripts",
  "node fonts/generate.mjs",
]

[tasks."fonts:check"]
description = "Fail if the checked-in font outputs differ from a fresh generation"
dir = "{{config_root}}"
run = [
  "pnpm --dir fonts install --frozen-lockfile --ignore-scripts",
  "node fonts/generate.mjs --check",
]

# Renders logo/ into the app icon images (tauri icon also writes icns and ico, then the generator
# prunes what the bundle doesn't list) and the text outputs that `logo:check` compares. The icon
# images are not diffed, only regenerated when logo/ changes.
[tasks."logo:gen"]
description = "Regenerate the logo outputs from logo/ (app icons, device bitmap, app copies)"
dir = "app"
run = [
  "pnpm tauri icon ../logo/app-icon.svg",
  "cargo run --manifest-path src-tauri/Cargo.toml --example logo_gen",
]

[tasks."logo:check"]
description = "Fail if the checked-in logo text outputs differ from a fresh generation"
dir = "{{config_root}}"
run = "cargo run --manifest-path app/src-tauri/Cargo.toml --example logo_gen -- --check"

[tasks.lint]
description = "Run all pre-commit hooks on every file"
run = "prek run --all-files"

[tasks.fmt]
description = "Format all sources"
run = [
  "cargo fmt --manifest-path app/src-tauri/Cargo.toml",
  "biome format --write app",
  "taplo fmt",
  "rumdl fmt .",
  "git ls-files -z 'firmware/*.c' 'firmware/*.h' ':!firmware/main/fonts/' | xargs -0 -r clang-format -i",
]
