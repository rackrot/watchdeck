[package]
name = "watchdeck"
version = "0.1.0"
description = "Stream Deck-style homelab controller"
authors = ["Buck Brady"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "watchdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = [
  "rt",
  "macros",
  "net",
  "time",
  "process",
  "sync",
] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
gethostname = "1.1.0"
log = "0.4.34"
env_logger = "0.11.11"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
tokio-rustls = "0.26.6"
sha2 = "0.11.0"
time = "0.3.55"
rcgen = { version = "0.14.10", default-features = false, features = [
  "aws_lc_rs",
  "pem",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = [
  "rt-multi-thread",
  "macros",
  "test-util",
  "time",
] }
