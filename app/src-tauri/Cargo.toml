[package]
name = "watchdeck"
version = "0.1.0"
description = "Stream Deck-style homelab controller"
authors = ["Buck Brady"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "watchdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = [
  "rt",
  "macros",
  "net",
  "time",
  "process",
  "sync",
] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
gethostname = "1.1.0"
log = "0.4.34"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
tokio-rustls = "0.26.6"
sha2 = "0.11.0"
# Already in the tree through rustls and rcgen. Declared for constant-time compares and the
# system RNG, without changing its features.
aws-lc-rs = { version = "1.18.1", default-features = false }
# `local-offset` is for the host's UTC offset in the `stats` frame (`daemon/hoststats.rs`).
time = { version = "0.3.55", features = ["local-offset"] }
rcgen = { version = "0.14.10", default-features = false, features = [
  "aws_lc_rs",
  "pem",
] }
# `rustls` is rustls on aws-lc-rs. reqwest takes the process's installed provider when there is
# one. No http2, charset or system-proxy: actions speak HTTP/1.1 straight to their URL.
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
] }
nix = { version = "0.31.3", features = ["signal"] }
toml = "1.1.8"
# Raster icons are PNG, JPEG or WebP. Nothing else, so no default formats.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
tauri-plugin-log = "2.10"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
# SVG icons are untrusted. No default features, so no text, fonts or embedded raster images.
resvg = { version = "0.48.1", default-features = false }
roxmltree = "0.21.1"
# The CSS tokenizer usvg 0.48 uses, so a style attribute is checked as usvg reads it.
simplecss = "0.2.2"
# NVIDIA GPU busy share and temperature (`daemon/gpu/nvidia.rs`). Vetted by hand (status-bar-2 V0).
# It dlopen()s libnvidia-ml.so.1 at runtime and links nothing, so a host without the driver
# still builds and runs. No default features: that leaves out the optional serde.
nvml-wrapper = { version = "=0.13.0", default-features = false }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The SVG renderer. Unoptimized it is 20 to 50 times slower than in a release build, which
# would make icons slow in `app:dev` and the SVG cost tests in icons.rs measure the wrong thing.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = [
  "rt-multi-thread",
  "macros",
  "test-util",
  "signal",
  "time",
] }
