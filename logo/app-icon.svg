    <defs>
      <mask id="wd-a-keys" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
        <rect x="102" y="217" width="820" height="570" rx="112" fill="#fff"/>
        <rect x="172" y="287" width="180" height="180" rx="42" fill="#000"/>
        <rect x="422" y="287" width="180" height="180" rx="42" fill="#000"/>
        <rect x="172" y="537" width="180" height="180" rx="42" fill="#000"/>
        <rect x="422" y="537" width="180" height="180" rx="42" fill="#000"/>
        <rect x="672" y="537" width="180" height="180" rx="42" fill="#000"/>
      </mask>
    </defs>
    <rect x="102" y="217" width="820" height="570" rx="112" fill="#e7edf3" mask="url(#wd-a-keys)"/>
    <rect x="672" y="287" width="180" height="180" rx="42" fill="#38bdf8"/>
